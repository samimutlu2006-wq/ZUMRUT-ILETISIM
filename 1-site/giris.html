<!doctype html>
<html lang="tr" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Yönetici Girişi · Zümrüt İletişim</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/InterVariable-latin.woff" as="font" type="font/woff" crossorigin>
  <link rel="stylesheet" href="assets/css/site.css">
  <script defer src="assets/js/cizim.js"></script>
  <script defer src="assets/js/ortak.js"></script>
  <script defer src="assets/js/guvenlik.js"></script>
  <script defer src="assets/js/giris.js"></script>
</head>
<body class="zi-giris-sayfasi">
  <header id="zi-nav" class="zi-nav">
    <div class="zi-nav__ic"><a class="zi-marka" href="index.html"><img class="zi-logo" src="assets/img/logo.svg" alt="Zümrüt İletişim" width="138" height="30"></a></div>
  </header>

  <main class="zi-giris" id="icerik">
    <div class="zi-giris__kutu">
      <div class="zi-giris__tas" id="giris-tas" aria-hidden="true"></div>
      <h1>Yönetici Girişi</h1>
      <p class="zi-giris__alt">Depo takip paneline erişmek için giriş yapın.</p>

      <form id="giris-formu" novalidate>
        <div class="zi-alan">
          <input id="kullanici" name="kullanici" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required placeholder=" ">
          <label for="kullanici">Kullanıcı adı</label>
        </div>
        <div class="zi-alan zi-alan--sifre">
          <input id="sifre" name="sifre" type="password" autocomplete="current-password" required placeholder=" ">
          <label for="sifre">Şifre</label>
          <button class="zi-alan__goz" type="button" id="goz" aria-label="Şifreyi göster" aria-pressed="false">
            <svg class="zi-ikon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <p class="zi-giris__hata" id="hata" role="alert" hidden></p>
        <button class="zi-btn zi-btn--dolu zi-btn--buyuk zi-giris__btn" type="submit" id="giris-btn">
          <span>Giriş Yap</span>
          <svg class="zi-ikon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 12h15"/><path d="m13 5.5 6.5 6.5-6.5 6.5"/></svg>
        </button>
      </form>

      <p class="zi-giris__not">
        <svg class="zi-ikon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10" rx="2.2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>
        <span>Bu alan yalnızca mağaza yöneticisi içindir. Şifreniz bu cihazda doğrulanır; hiçbir yere gönderilmez ya da açık metin olarak saklanmaz.</span>
      </p>
      <a class="zi-link-ok" href="index.html"><svg class="zi-ikon" viewBox="0 0 24 24" aria-hidden="true"><path d="m14.5 5.5-6.5 6.5 6.5 6.5"/></svg> Siteye dön</a>
    </div>
  </main>
</body>
</html>
